<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Destinations" />
  <title>Mes destinations · V7</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07080c;
      --panel: rgba(24, 25, 30, 0.94);
      --panel2: rgba(43, 44, 51, 0.90);
      --text: #f7f7fa;
      --muted: #9da2ad;
      --line: rgba(255,255,255,.075);
      --accent: #4f8cff;
      --danger: #ff626a;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 90% -10%, rgba(85,112,255,.25), transparent 38%),
        radial-gradient(circle at -10% 25%, rgba(58,201,182,.09), transparent 35%),
        var(--bg);
      color: var(--text);
    }

    button, input { font: inherit; }
    button { color: inherit; cursor: pointer; }

    .app {
      width: min(100%, 520px);
      height: 100dvh;
      min-height: 100dvh;
      margin: 0 auto;
      padding:
        calc(env(safe-area-inset-top) + 10px)
        12px
        calc(env(safe-area-inset-bottom) + 10px);
      display: flex;
      flex-direction: column;
      gap: 7px;
      overflow: hidden;
    }

    .topbar,
    .section-head,
    .modal-head,
    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .eyebrow {
      margin: 0 0 2px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 850;
      letter-spacing: .13em;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 6vw, 29px);
      line-height: 1;
      letter-spacing: -.04em;
      font-weight: 780;
    }

    h2 {
      margin: 0;
      font-size: 17px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      flex: 0 0 40px;
      border: 0;
      border-radius: 13px;
      background: var(--panel2);
      font-size: 24px;
      display: grid;
      place-items: center;
      box-shadow: inset 0 0 0 1px var(--line);
    }

    .gps-panel {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: stretch;
    }

    .provider-card {
      min-width: 0;
      padding: 6px 7px;
      border-radius: 14px;
      background: var(--panel);
      box-shadow: inset 0 0 0 1px var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 7px;
    }

    .provider-card > span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
      white-space: nowrap;
    }

    .segmented {
      display: flex;
      gap: 3px;
      min-width: 0;
      background: #111319;
      padding: 3px;
      border-radius: 11px;
    }

    .provider {
      border: 0;
      border-radius: 8px;
      padding: 7px 8px;
      background: transparent;
      font-size: 11px;
      font-weight: 850;
      color: var(--muted);
      white-space: nowrap;
    }

    .provider.active {
      background: var(--panel2);
      color: white;
    }

    .quick-open {
      display: flex;
      gap: 5px;
    }

    .quick-map {
      min-width: 42px;
      height: 40px;
      border: 0;
      border-radius: 12px;
      background: var(--panel);
      box-shadow: inset 0 0 0 1px var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 0 9px;
      font-size: 18px;
    }

    .quick-map small {
      display: none;
    }

    .quick-map:active {
      background: var(--panel2);
    }

    .searchbox {
      height: 40px;
      flex: 0 0 40px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--panel);
      border-radius: 13px;
      box-shadow: inset 0 0 0 1px var(--line);
    }

    .searchbox span {
      font-size: 20px;
      color: var(--muted);
    }

    .searchbox input {
      flex: 1;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      font-size: 14.5px;
      min-width: 0;
    }

    .searchbox input::placeholder { color: #7f8592; }

    .favorites-section {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .section-head {
      flex: 0 0 auto;
      margin: 0 1px 5px;
    }

    #countLabel {
      color: var(--muted);
      font-size: 12px;
    }

    .grid {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: none;
      padding-bottom: 1px;
    }

    .grid::-webkit-scrollbar { display: none; }

    .grid::after {
      content: "";
      flex: 0 0 1px;
    }

    .card {
      flex: 0 0 54px;
      min-height: 54px;
      position: relative;
      display: block;
      background: var(--panel);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px var(--line);
      transition: transform .12s ease, background .12s ease;
    }

    .card:active {
      transform: scale(.992);
      background: rgba(34, 35, 41, .98);
    }

    .open-destination {
      width: 100%;
      height: 100%;
      min-width: 0;
      border: 0;
      background: transparent;
      text-align: left;
      display: grid;
      grid-template-columns: 34px 1fr 14px;
      grid-template-rows: auto auto;
      align-content: center;
      align-items: center;
      column-gap: 9px;
      row-gap: 1px;
      padding: 6px 39px 6px 9px;
    }

    .destination-icon {
      width: 34px;
      height: 34px;
      grid-row: 1 / 3;
      border-radius: 10px;
      background: var(--panel2);
      display: grid;
      place-items: center;
      font-size: 19px;
    }

    .destination-copy {
      min-width: 0;
      display: contents;
    }

    .destination-copy strong,
    .destination-copy small {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }

    .destination-copy strong {
      align-self: end;
      font-size: 15px;
      line-height: 1.08;
      font-weight: 720;
      letter-spacing: -.01em;
    }

    .destination-copy small {
      align-self: start;
      color: var(--muted);
      font-size: 10.5px;
      line-height: 1.15;
    }

    .arrow {
      display: block;
      grid-column: 3;
      grid-row: 1 / 3;
      color: #767b86;
      font-size: 15px;
      font-weight: 800;
      justify-self: end;
    }

    .edit-btn {
      position: absolute;
      top: 50%;
      right: 5px;
      transform: translateY(-50%);
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 9px;
      background: rgba(255,255,255,.04);
      font-size: 12px;
      line-height: 1;
      color: #8f949e;
    }

    .empty {
      padding: 28px 12px;
      text-align: center;
      color: var(--muted);
    }

    .hint {
      display: none;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 10px;
      background: rgba(0,0,0,.64);
      backdrop-filter: blur(8px);
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      width: min(620px, 100%);
      max-height: calc(100dvh - env(safe-area-inset-top) - 14px);
      overflow-y: auto;
      margin-bottom: env(safe-area-inset-bottom);
      padding: 16px;
      background: #15171e;
      border-radius: 24px;
      box-shadow: 0 22px 80px rgba(0,0,0,.55), inset 0 0 0 1px var(--line);
    }

    .close-btn {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 12px;
      background: var(--panel2);
      font-size: 22px;
    }

    .form-label {
      display: block;
      margin-top: 13px;
      color: var(--muted);
      font-weight: 750;
      font-size: 12px;
    }

    .form-label input {
      display: block;
      width: 100%;
      margin-top: 6px;
      border: 1px solid var(--line);
      outline: none;
      background: #0d0f14;
      color: white;
      border-radius: 13px;
      padding: 12px 13px;
      font-size: 16px;
    }

    .form-label input:focus {
      border-color: rgba(91,140,255,.75);
    }

    .emoji-row {
      margin-top: 7px;
      display: grid;
      grid-template-columns: 54px 1fr;
      gap: 8px;
      align-items: stretch;
    }

    .emoji-input {
      margin: 0 !important;
      padding: 8px !important;
      text-align: center;
      font-size: 26px !important;
    }

    .emoji-keyboard-btn {
      border: 1px solid var(--line);
      border-radius: 13px;
      background: #0d0f14;
      color: var(--text);
      font-size: 13px;
      font-weight: 750;
    }

    .emoji-help {
      margin: 6px 0 0;
      color: #7f8592;
      font-size: 11px;
      line-height: 1.3;
    }

    .emoji-palette {
      margin-top: 9px;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 5px;
    }

    .emoji-choice {
      aspect-ratio: 1;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #0d0f14;
      font-size: 20px;
      display: grid;
      place-items: center;
      padding: 0;
    }

    .emoji-choice.selected {
      border-color: rgba(91,140,255,.9);
      background: rgba(91,140,255,.18);
    }

    .actions {
      margin-top: 18px;
    }

    .primary, .danger {
      min-height: 46px;
      border: 0;
      border-radius: 13px;
      padding: 0 17px;
      font-weight: 850;
    }

    .primary {
      margin-left: auto;
      background: var(--accent);
      color: white;
    }

    .danger {
      background: rgba(255,98,106,.14);
      color: #ff8c92;
    }

    .error {
      min-height: 17px;
      margin: 8px 0 0;
      color: #ff9298;
      font-size: 12px;
    }

    @media (min-width: 600px) {
      .app {
        width: min(760px, 100%);
      }

      .modal-backdrop {
        align-items: center;
      }

      .quick-map {
        width: auto;
        min-width: 110px;
        padding: 0 12px;
        display: flex;
        gap: 7px;
      }

      .quick-map small {
        display: inline;
        font-size: 11px;
        font-weight: 800;
      }
    }

    @media (max-height: 760px) {
      .app {
        gap: 6px;
        padding-top: calc(env(safe-area-inset-top) + 6px);
        padding-bottom: calc(env(safe-area-inset-bottom) + 6px);
      }

      .searchbox {
        height: 40px;
        flex-basis: 40px;
      }

      .icon-btn {
        width: 40px;
        height: 40px;
        flex-basis: 40px;
      }

      .card {
        flex-basis: 50px;
        min-height: 50px;
      }

      .destination-icon {
        width: 34px;
        height: 34px;
        font-size: 19px;
      }

      .open-destination {
        grid-template-columns: 34px 1fr 18px;
        padding-top: 6px;
        padding-bottom: 6px;
      }

      .destination-copy strong {
        font-size: 14.5px;
      }

      .destination-copy small {
        font-size: 10.5px;
      }
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tool-btn {
      width: 40px;
      height: 40px;
      flex: 0 0 40px;
      border: 0;
      border-radius: 13px;
      background: var(--panel2);
      box-shadow: inset 0 0 0 1px var(--line);
      color: var(--text);
      display: grid;
      place-items: center;
      font-size: 19px;
    }

    .recents-section[hidden] {
      display: none;
    }

    .recents-section {
      flex: 0 0 auto;
    }

    .recents-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 1px 5px;
    }

    .recents-head h2 {
      font-size: 14px;
    }

    .recents-clear {
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      padding: 3px 2px;
    }

    .recent-list {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 1px;
    }

    .recent-list::-webkit-scrollbar {
      display: none;
    }

    .recent-chip {
      min-width: 0;
      max-width: 44%;
      height: 36px;
      flex: 0 0 auto;
      border: 0;
      border-radius: 12px;
      background: var(--panel);
      box-shadow: inset 0 0 0 1px var(--line);
      padding: 0 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text);
    }

    .recent-chip .recent-icon {
      flex: 0 0 auto;
      font-size: 16px;
    }

    .recent-chip .recent-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 720;
    }

    .distance-tag {
      color: #78d7be;
      font-weight: 700;
    }

    .tools-grid {
      display: grid;
      gap: 8px;
      margin-top: 14px;
    }

    .tool-row {
      width: 100%;
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #0d0f14;
      color: var(--text);
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      text-align: left;
    }

    .tool-row strong {
      display: block;
      font-size: 14px;
    }

    .tool-row small {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.25;
    }

    .tool-row .tool-icon {
      font-size: 20px;
      flex: 0 0 auto;
    }

    .status-box {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 13px;
      background: rgba(255,255,255,.04);
      color: var(--muted);
      font-size: 11.5px;
      line-height: 1.35;
    }

    .coords-panel {
      margin-top: 12px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,.025);
    }

    .coords-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .coords-copy strong {
      display: block;
      font-size: 13px;
    }

    .coords-copy small {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 10.5px;
    }

    .secondary {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--panel2);
      color: var(--text);
      padding: 0 11px;
      font-size: 11px;
      font-weight: 780;
    }

    .reorder-list {
      margin-top: 12px;
      display: grid;
      gap: 6px;
    }

    .reorder-item {
      min-height: 50px;
      display: grid;
      grid-template-columns: 34px 1fr auto;
      align-items: center;
      gap: 9px;
      padding: 7px 8px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: #0d0f14;
    }

    .reorder-icon {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: var(--panel2);
      font-size: 18px;
    }

    .reorder-name {
      min-width: 0;
      font-size: 13px;
      font-weight: 720;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .reorder-actions {
      display: flex;
      gap: 4px;
    }

    .reorder-arrow {
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 10px;
      background: var(--panel2);
      color: var(--text);
      font-size: 15px;
    }

    .reorder-arrow:disabled {
      opacity: .25;
    }

    .import-input {
      display: none;
    }

    @media (max-height: 760px) {
      .recent-chip {
        height: 32px;
      }

      .recents-head {
        margin-bottom: 3px;
      }
    }

  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">NAVIGATION · V7</p>
        <h1>Mes destinations</h1>
      </div>
      <div class="top-actions">
        <button id="toolsBtn" class="tool-btn" type="button" aria-label="Outils">⚙︎</button>
        <button id="addBtn" class="icon-btn" type="button" aria-label="Ajouter une destination">＋</button>
      </div>
    </header>

    <section class="gps-panel" aria-label="Application GPS">
      <div class="provider-card">
        <span>Favoris avec</span>
        <div class="segmented">
          <button class="provider" type="button" data-provider="google">Google</button>
          <button class="provider" type="button" data-provider="waze">Waze</button>
        </div>
      </div>

      <div class="quick-open" aria-label="Ouvrir une application GPS sans destination">
        <button id="openGoogleBtn" class="quick-map" type="button" aria-label="Ouvrir Google Maps sans destination">
          🗺️<small>Google Maps</small>
        </button>
        <button id="openWazeBtn" class="quick-map" type="button" aria-label="Ouvrir Waze sans destination">
          🚙<small>Waze</small>
        </button>
      </div>
    </section>

    <label class="searchbox">
      <span>⌕</span>
      <input id="searchInput" type="search" placeholder="Rechercher dans mes destinations" autocomplete="off" />
    </label>

    <section id="recentsSection" class="recents-section" hidden>
      <div class="recents-head">
        <h2>Récentes</h2>
        <button id="clearRecentsBtn" class="recents-clear" type="button">Effacer</button>
      </div>
      <div id="recentList" class="recent-list"></div>
    </section>

    <section class="favorites-section">
      <div class="section-head">
        <h2>Favoris</h2>
        <span id="countLabel"></span>
      </div>
      <div id="destinationsGrid" class="grid"></div>
      <div id="emptyState" class="empty" hidden>Aucune destination trouvée.</div>
    </section>
  </main>

  <div id="modalBackdrop" class="modal-backdrop" aria-hidden="true">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <div>
          <p class="eyebrow">DESTINATION</p>
          <h2 id="modalTitle">Ajouter</h2>
        </div>
        <button id="closeBtn" class="close-btn" type="button" aria-label="Fermer">×</button>
      </div>

      <form id="destinationForm" novalidate>
        <label class="form-label">Nom
          <input id="nameInput" maxlength="40" placeholder="Ex. Maison" autocomplete="off" />
        </label>
        <label class="form-label">Adresse ou lieu
          <input id="addressInput" maxlength="180" placeholder="Ex. 10 avenue des Champs-Élysées, Paris" autocomplete="street-address" />
        </label>
        <label class="form-label">Icône
          <div class="emoji-row">
            <input id="iconInput" class="emoji-input" maxlength="8" value="📍" aria-label="Emoji de la destination" autocomplete="off" />
            <button id="emojiKeyboardBtn" class="emoji-keyboard-btn" type="button">⌨️ Clavier / emoji iOS</button>
          </div>
          <p class="emoji-help">Tu peux choisir ci-dessous ou toucher le champ puis utiliser le clavier emoji de l’iPhone.</p>
          <div id="emojiPalette" class="emoji-palette" aria-label="Palette d’icônes">
            <button class="emoji-choice" type="button">🏠</button>
            <button class="emoji-choice" type="button">🏡</button>
            <button class="emoji-choice" type="button">🏢</button>
            <button class="emoji-choice" type="button">💼</button>
            <button class="emoji-choice" type="button">🏫</button>
            <button class="emoji-choice" type="button">🏥</button>
            <button class="emoji-choice" type="button">🏨</button>
            <button class="emoji-choice" type="button">🏦</button>
            <button class="emoji-choice" type="button">🛒</button>
            <button class="emoji-choice" type="button">🛍️</button>
            <button class="emoji-choice" type="button">⛽️</button>
            <button class="emoji-choice" type="button">🔧</button>
            <button class="emoji-choice" type="button">🚗</button>
            <button class="emoji-choice" type="button">🚙</button>
            <button class="emoji-choice" type="button">🅿️</button>
            <button class="emoji-choice" type="button">🚉</button>
            <button class="emoji-choice" type="button">✈️</button>
            <button class="emoji-choice" type="button">⚓️</button>
            <button class="emoji-choice" type="button">⚽️</button>
            <button class="emoji-choice" type="button">🏋️</button>
            <button class="emoji-choice" type="button">🎾</button>
            <button class="emoji-choice" type="button">🏊</button>
            <button class="emoji-choice" type="button">🍽️</button>
            <button class="emoji-choice" type="button">☕️</button>
            <button class="emoji-choice" type="button">🍔</button>
            <button class="emoji-choice" type="button">🎬</button>
            <button class="emoji-choice" type="button">🎵</button>
            <button class="emoji-choice" type="button">🌳</button>
            <button class="emoji-choice" type="button">🏖️</button>
            <button class="emoji-choice" type="button">👨‍👩‍👦</button>
            <button class="emoji-choice" type="button">❤️</button>
            <button class="emoji-choice" type="button">⭐️</button>
            <button class="emoji-choice" type="button">📍</button>
            <button class="emoji-choice" type="button">📌</button>
            <button class="emoji-choice" type="button">🎯</button>
            <button class="emoji-choice" type="button">🧭</button>
            <button class="emoji-choice" type="button">🏰</button>
            <button class="emoji-choice" type="button">🏛️</button>
            <button class="emoji-choice" type="button">⛪️</button>
            <button class="emoji-choice" type="button">🕌</button>

        <div class="coords-panel">
          <div class="coords-line">
            <div class="coords-copy">
              <strong>Coordonnées GPS</strong>
              <small id="coordsStatus">Non enregistrées</small>

            <button id="useCurrentLocationBtn" class="secondary" type="button">📍 Utiliser ma position</button>

        <p id="formError" class="error"></p>
        <div class="actions">
          <button id="deleteBtn" class="danger" type="button" hidden>Supprimer</button>
          <button class="primary" type="submit">Enregistrer</button>

  <div id="toolsBackdrop" class="modal-backdrop" aria-hidden="true">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="toolsTitle">
      <div class="modal-head">
        <div>
          <p class="eyebrow">V7 · OUTILS</p>
          <h2 id="toolsTitle">Réglages</h2>
        </div>
        <button id="closeToolsBtn" class="close-btn" type="button" aria-label="Fermer">×</button>
      </div>

      <div class="tools-grid">
        <button id="locateBtn" class="tool-row" type="button">
          <span>
            <strong>Ma position et distances</strong>
            <small>Affiche la distance à vol d’oiseau pour les favoris ayant des coordonnées GPS.</small>
          </span>
          <span class="tool-icon">📍</span>
        </button>

        <button id="reorderBtn" class="tool-row" type="button">
          <span>
            <strong>Réorganiser les favoris</strong>
            <small>Choisis précisément l’ordre des destinations.</small>
          </span>
          <span class="tool-icon">↕️</span>
        </button>

        <button id="exportBtn" class="tool-row" type="button">
          <span>
            <strong>Exporter une sauvegarde</strong>
            <small>Enregistre tes favoris et réglages dans un fichier JSON.</small>
          </span>
          <span class="tool-icon">⬆️</span>
        </button>

        <button id="importBtn" class="tool-row" type="button">
          <span>
            <strong>Importer une sauvegarde</strong>
            <small>Restaure un fichier exporté par cette application.</small>
          </span>
          <span class="tool-icon">⬇️</span>
        </button>
        <input id="importInput" class="import-input" type="file" accept="application/json,.json" />
      </div>

      <div id="toolsStatus" class="status-box">
        Les coordonnées de ta position ne sont jamais sauvegardées par l’application.
      </div>
    </section>
  </div>

  <div id="reorderBackdrop" class="modal-backdrop" aria-hidden="true">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="reorderTitle">
      <div class="modal-head">
        <div>
          <p class="eyebrow">FAVORIS</p>
          <h2 id="reorderTitle">Réorganiser</h2>
        </div>
        <button id="closeReorderBtn" class="close-btn" type="button" aria-label="Fermer">×</button>
      </div>
      <div id="reorderList" class="reorder-list"></div>
    </section>
  </div>

  <script>
    (() => {
      'use strict';

      const STORAGE_KEY = 'gps-destinations-v3';
      const PROVIDER_KEY = 'gps-provider-v3';
      const LEGACY_STORAGE_KEYS = ['gps-destinations-v2', 'gps-destinations-v1'];
      const LEGACY_PROVIDER_KEYS = ['gps-provider-v2', 'gps-provider-v1'];
      const RECENTS_KEY = 'gps-recents-v7';
      const MAX_RECENTS = 3;

      const makeId = () => {
        if (window.crypto && typeof window.crypto.randomUUID === 'function') return window.crypto.randomUUID();
        return 'd-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
      };

      const defaults = [
        { id: makeId(), name: 'Maison', address: "8 allée de l'Orge, 91390 Morsang-sur-Orge, France", icon: '🏠' },
        { id: makeId(), name: 'Châtillon', address: "2 rue d'Esneux Tilf, 21400 Châtillon-sur-Seine, France", icon: '📍' },
        { id: makeId(), name: 'Châtillon GRESSET', address: "30 rue Général de Gaulle, 21400 Châtillon-sur-Seine, France", icon: '🏡' },
        { id: makeId(), name: 'Crespy', address: "10 rue Charles Herbelot, 10300 Crespy-le-Neuf, France", icon: '📍' },
        { id: makeId(), name: 'Travail', address: "1 avenue Carnot, 91300 Massy, France", icon: '💼' },
        { id: makeId(), name: 'Alderys', address: "Alderys, Avenue de Paris, Orsay, France", icon: '🏢' }
      ];

      const $ = (id) => document.getElementById(id);
      const addBtn = $('addBtn');
      const searchInput = $('searchInput');
      const grid = $('destinationsGrid');
      const countLabel = $('countLabel');
      const emptyState = $('emptyState');
      const modalBackdrop = $('modalBackdrop');
      const closeBtn = $('closeBtn');
      const modalTitle = $('modalTitle');
      const form = $('destinationForm');
      const nameInput = $('nameInput');
      const addressInput = $('addressInput');
      const iconInput = $('iconInput');
      const deleteBtn = $('deleteBtn');
      const formError = $('formError');
      const emojiKeyboardBtn = $('emojiKeyboardBtn');
      const emojiPalette = $('emojiPalette');
      const openGoogleBtn = $('openGoogleBtn');
      const openWazeBtn = $('openWazeBtn');
      const toolsBtn = $('toolsBtn');
      const toolsBackdrop = $('toolsBackdrop');
      const closeToolsBtn = $('closeToolsBtn');
      const locateBtn = $('locateBtn');
      const reorderBtn = $('reorderBtn');
      const exportBtn = $('exportBtn');
      const importBtn = $('importBtn');
      const importInput = $('importInput');
      const toolsStatus = $('toolsStatus');
      const reorderBackdrop = $('reorderBackdrop');
      const closeReorderBtn = $('closeReorderBtn');
      const reorderList = $('reorderList');
      const recentsSection = $('recentsSection');
      const recentList = $('recentList');
      const clearRecentsBtn = $('clearRecentsBtn');
      const useCurrentLocationBtn = $('useCurrentLocationBtn');
      const coordsStatus = $('coordsStatus');

      let editingId = null;
      let provider = loadProvider();
      let destinations = load();
      let recents = loadRecents();
      let currentPosition = null;
      let pendingCoords = null;

      function loadProvider() {
        const current = localStorage.getItem(PROVIDER_KEY);
        if (current === 'google' || current === 'waze') return current;

        for (const key of LEGACY_PROVIDER_KEYS) {
          const legacy = localStorage.getItem(key);
          if (legacy === 'google' || legacy === 'waze') {
            localStorage.setItem(PROVIDER_KEY, legacy);
            return legacy;
          }
        }
        return 'google';
      }

      function isPlaceholder(item) {
        return !item || !item.address || /^votre\s/i.test(String(item.address).trim());
      }

      function uniqueDestinations(items) {
        const seen = new Set();
        return items.filter(item => {
          const key = normalize(`${item.name}|${item.address}`);
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        });
      }

      function load() {
        try {
          const current = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (Array.isArray(current) && current.length) return current;
        } catch (_) {}

        let legacyCustom = [];
        for (const key of LEGACY_STORAGE_KEYS) {
          try {
            const data = JSON.parse(localStorage.getItem(key));
            if (Array.isArray(data)) {
              legacyCustom.push(...data.filter(item => !isPlaceholder(item)));
            }
          } catch (_) {}
        }

        const migrated = uniqueDestinations([...defaults, ...legacyCustom]);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
        return migrated;
      }

      function save() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(destinations));
      }

      function loadRecents() {
        try {
          const data = JSON.parse(localStorage.getItem(RECENTS_KEY));
          return Array.isArray(data) ? data.slice(0, MAX_RECENTS) : [];
        } catch (_) {
          return [];
        }
      }

      function saveRecents() {
        localStorage.setItem(RECENTS_KEY, JSON.stringify(recents));
      }

      function rememberRecent(id) {
        recents = [id, ...recents.filter(itemId => itemId !== id)].slice(0, MAX_RECENTS);
        saveRecents();
      }

      function haversineKm(lat1, lon1, lat2, lon2) {
        const toRad = value => value * Math.PI / 180;
        const R = 6371;
        const dLat = toRad(lat2 - lat1);
        const dLon = toRad(lon2 - lon1);
        const a =
          Math.sin(dLat / 2) ** 2 +
          Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
          Math.sin(dLon / 2) ** 2;
        return 2 * R * Math.asin(Math.sqrt(a));
      }

      function formatDistance(km) {
        if (!Number.isFinite(km)) return '';
        if (km < 1) return `${Math.max(10, Math.round(km * 1000 / 10) * 10)} m`;
        if (km < 10) return `${km.toFixed(1).replace('.', ',')} km`;
        return `${Math.round(km)} km`;
      }

      function itemDistance(item) {
        if (!currentPosition || !Number.isFinite(item.lat) || !Number.isFinite(item.lon)) return '';
        return formatDistance(
          haversineKm(
            currentPosition.lat,
            currentPosition.lon,
            Number(item.lat),
            Number(item.lon)
          )
        );
      }

      function getCurrentPosition(options = {}) {
        return new Promise((resolve, reject) => {
          if (!navigator.geolocation) {
            reject(new Error('La géolocalisation n’est pas disponible sur cet appareil.'));
            return;
          }
          navigator.geolocation.getCurrentPosition(
            position => resolve({
              lat: position.coords.latitude,
              lon: position.coords.longitude,
              accuracy: position.coords.accuracy
            }),
            error => {
              const messages = {
                1: 'Autorisation de localisation refusée.',
                2: 'Position actuellement indisponible.',
                3: 'La localisation a pris trop de temps.'
              };
              reject(new Error(messages[error.code] || 'Impossible d’obtenir ta position.'));
            },
            {
              enableHighAccuracy: true,
              timeout: 12000,
              maximumAge: options.maximumAge ?? 30000
            }
          );
        });
      }

      function openSheet(backdrop) {
        backdrop.classList.add('open');
        backdrop.setAttribute('aria-hidden', 'false');
      }

      function closeSheet(backdrop) {
        backdrop.classList.remove('open');
        backdrop.setAttribute('aria-hidden', 'true');
      }

      function renderRecents() {
        const items = recents
          .map(id => destinations.find(item => item.id === id))
          .filter(Boolean)
          .slice(0, MAX_RECENTS);

        recentList.innerHTML = '';
        recentsSection.hidden = items.length === 0;

        items.forEach(item => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'recent-chip';

          const icon = document.createElement('span');
          icon.className = 'recent-icon';
          icon.textContent = item.icon || '📍';

          const name = document.createElement('span');
          name.className = 'recent-name';
          name.textContent = item.name;

          button.append(icon, name);
          button.addEventListener('click', () => openNavigation(item));
          recentList.appendChild(button);
        });
      }

      function renderReorder() {
        reorderList.innerHTML = '';

        destinations.forEach((item, index) => {
          const row = document.createElement('div');
          row.className = 'reorder-item';

          const icon = document.createElement('span');
          icon.className = 'reorder-icon';
          icon.textContent = item.icon || '📍';

          const name = document.createElement('span');
          name.className = 'reorder-name';
          name.textContent = item.name;

          const actions = document.createElement('div');
          actions.className = 'reorder-actions';

          const up = document.createElement('button');
          up.type = 'button';
          up.className = 'reorder-arrow';
          up.textContent = '↑';
          up.disabled = index === 0;
          up.setAttribute('aria-label', `Monter ${item.name}`);
          up.addEventListener('click', () => moveDestination(index, index - 1));

          const down = document.createElement('button');
          down.type = 'button';
          down.className = 'reorder-arrow';
          down.textContent = '↓';
          down.disabled = index === destinations.length - 1;
          down.setAttribute('aria-label', `Descendre ${item.name}`);
          down.addEventListener('click', () => moveDestination(index, index + 1));

          actions.append(up, down);
          row.append(icon, name, actions);
          reorderList.appendChild(row);
        });
      }

      function moveDestination(fromIndex, toIndex) {
        if (toIndex < 0 || toIndex >= destinations.length || fromIndex === toIndex) return;
        const [moved] = destinations.splice(fromIndex, 1);
        destinations.splice(toIndex, 0, moved);
        save();
        renderReorder();
        render();
      }

      function updateCoordsStatus() {
        if (pendingCoords && Number.isFinite(pendingCoords.lat) && Number.isFinite(pendingCoords.lon)) {
          const accuracy = Number.isFinite(pendingCoords.accuracy)
            ? ` · précision ±${Math.round(pendingCoords.accuracy)} m`
            : '';
          coordsStatus.textContent =
            `${pendingCoords.lat.toFixed(5)}, ${pendingCoords.lon.toFixed(5)}${accuracy}`;
        } else {
          coordsStatus.textContent = 'Non enregistrées';
        }
      }

      function exportBackup() {
        const payload = {
          app: 'destinations-gps',
          version: 7,
          exportedAt: new Date().toISOString(),
          provider,
          destinations,
          recents
        };

        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        const date = new Date().toISOString().slice(0, 10);
        link.href = url;
        link.download = `destinations-gps-${date}.json`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        toolsStatus.textContent = 'Sauvegarde exportée. Garde le fichier dans Fichiers ou iCloud Drive.';
      }

      function validateImportedDestinations(value) {
        if (!Array.isArray(value)) return null;

        const cleaned = value
          .filter(item => item && typeof item.name === 'string' && typeof item.address === 'string')
          .map(item => ({
            id: typeof item.id === 'string' && item.id ? item.id : makeId(),
            name: item.name.trim().slice(0, 40),
            address: item.address.trim().slice(0, 180),
            icon: typeof item.icon === 'string' && item.icon ? item.icon.slice(0, 8) : '📍',
            ...(Number.isFinite(Number(item.lat)) && Number.isFinite(Number(item.lon))
              ? { lat: Number(item.lat), lon: Number(item.lon) }
              : {})
          }))
          .filter(item => item.name && item.address);

        return cleaned.length ? uniqueDestinations(cleaned) : null;
      }

      function normalize(value) {
        return String(value || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
      }

      function navigationUrl(address) {
        const q = encodeURIComponent(address.trim());
        return provider === 'waze'
          ? `https://www.waze.com/ul?q=${q}&navigate=yes`
          : `https://www.google.com/maps/dir/?api=1&destination=${q}&travelmode=driving`;
      }

      function openGpsApp(app) {
        const scheme = app === 'waze' ? 'waze://' : 'comgooglemaps://';
        const fallback = app === 'waze'
          ? 'https://www.waze.com/ul'
          : 'https://www.google.com/maps';

        let fallbackTimer = null;

        const cleanup = () => {
          if (fallbackTimer) clearTimeout(fallbackTimer);
          document.removeEventListener('visibilitychange', onVisibilityChange);
        };

        const onVisibilityChange = () => {
          if (document.hidden) cleanup();
        };

        document.addEventListener('visibilitychange', onVisibilityChange);

        fallbackTimer = setTimeout(() => {
          cleanup();
          window.location.href = fallback;
        }, 900);

        window.location.href = scheme;
      }

      function updateEmojiSelection() {
        const current = iconInput.value.trim();
        emojiPalette.querySelectorAll('.emoji-choice').forEach(button => {
          button.classList.toggle('selected', button.textContent.trim() === current);
        });
      }

      function openNavigation(item) {
        if (!item.address || /^votre /i.test(item.address)) {
          openEdit(item.id);
          return;
        }
        rememberRecent(item.id);
        renderRecents();
        window.location.href = navigationUrl(item.address);
      }

      function render() {
        const q = normalize(searchInput.value.trim());
        const filtered = destinations.filter(item => normalize(item.name + ' ' + item.address).includes(q));
        grid.innerHTML = '';

        filtered.forEach(item => {
          const card = document.createElement('article');
          card.className = 'card';

          const openBtn = document.createElement('button');
          openBtn.type = 'button';
          openBtn.className = 'open-destination';
          openBtn.innerHTML = `
            <span class="destination-icon"></span>
            <span class="destination-copy"><strong></strong><small></small></span>
            <span class="arrow">›</span>`;
          openBtn.querySelector('.destination-icon').textContent = item.icon || '📍';
          openBtn.querySelector('strong').textContent = item.name;
          const distance = itemDistance(item);
          const small = openBtn.querySelector('small');
          small.textContent = item.address;
          if (distance) {
            const distanceSpan = document.createElement('span');
            distanceSpan.className = 'distance-tag';
            distanceSpan.textContent = ` · ${distance}`;
            small.appendChild(distanceSpan);
          }
          openBtn.addEventListener('click', () => openNavigation(item));

          const editBtn = document.createElement('button');
          editBtn.type = 'button';
          editBtn.className = 'edit-btn';
          editBtn.textContent = '•••';
          editBtn.setAttribute('aria-label', 'Modifier ' + item.name);
          editBtn.addEventListener('click', () => openEdit(item.id));

          card.append(openBtn, editBtn);
          grid.appendChild(card);
        });

        countLabel.textContent = `${filtered.length} destination${filtered.length > 1 ? 's' : ''}`;
        emptyState.hidden = filtered.length !== 0;
        renderRecents();
      }

      function openModal() {
        modalBackdrop.classList.add('open');
        modalBackdrop.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
        setTimeout(() => nameInput.focus(), 100);
      }

      function closeModal() {
        modalBackdrop.classList.remove('open');
        modalBackdrop.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
        editingId = null;
        pendingCoords = null;
        formError.textContent = '';
      }

      function openAdd() {
        editingId = null;
        modalTitle.textContent = 'Ajouter';
        nameInput.value = '';
        addressInput.value = '';
        iconInput.value = '📍';
        pendingCoords = null;
        updateCoordsStatus();
        updateEmojiSelection();
        deleteBtn.hidden = true;
        formError.textContent = '';
        openModal();
      }

      function openEdit(id) {
        const item = destinations.find(d => d.id === id);
        if (!item) return;
        editingId = id;
        modalTitle.textContent = 'Modifier';
        nameInput.value = item.name;
        addressInput.value = /^votre /i.test(item.address) ? '' : item.address;
        iconInput.value = item.icon || '📍';
        pendingCoords = Number.isFinite(Number(item.lat)) && Number.isFinite(Number(item.lon))
          ? { lat: Number(item.lat), lon: Number(item.lon) }
          : null;
        updateCoordsStatus();
        updateEmojiSelection();
        deleteBtn.hidden = false;
        formError.textContent = '';
        openModal();
      }

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const name = nameInput.value.trim();
        const address = addressInput.value.trim();
        const icon = iconInput.value || '📍';

        if (!name || !address) {
          formError.textContent = 'Indique un nom et une adresse.';
          return;
        }

        const coords = pendingCoords && Number.isFinite(pendingCoords.lat) && Number.isFinite(pendingCoords.lon)
          ? { lat: pendingCoords.lat, lon: pendingCoords.lon }
          : {};

        if (editingId) {
          destinations = destinations.map(d =>
            d.id === editingId ? { ...d, name, address, icon, ...coords } : d
          );
        } else {
          destinations.unshift({ id: makeId(), name, address, icon, ...coords });
        }

        save();
        closeModal();
        render();
      });

      deleteBtn.addEventListener('click', () => {
        if (!editingId) return;
        const deletedId = editingId;
        destinations = destinations.filter(d => d.id !== deletedId);
        recents = recents.filter(id => id !== deletedId);
        save();
        saveRecents();
        closeModal();
        render();
      });

      addBtn.addEventListener('click', openAdd);
      closeBtn.addEventListener('click', closeModal);
      searchInput.addEventListener('input', render);
      modalBackdrop.addEventListener('click', (event) => {
        if (event.target === modalBackdrop) closeModal();
      });

      emojiKeyboardBtn.addEventListener('click', () => {
        iconInput.focus();
        iconInput.setSelectionRange(iconInput.value.length, iconInput.value.length);
      });

      iconInput.addEventListener('input', updateEmojiSelection);

      emojiPalette.addEventListener('click', (event) => {
        const button = event.target.closest('.emoji-choice');
        if (!button) return;
        iconInput.value = button.textContent.trim();
        updateEmojiSelection();
      });

      openGoogleBtn.addEventListener('click', () => openGpsApp('google'));
      openWazeBtn.addEventListener('click', () => openGpsApp('waze'));

      toolsBtn.addEventListener('click', () => openSheet(toolsBackdrop));
      closeToolsBtn.addEventListener('click', () => closeSheet(toolsBackdrop));
      toolsBackdrop.addEventListener('click', event => {
        if (event.target === toolsBackdrop) closeSheet(toolsBackdrop);
      });

      locateBtn.addEventListener('click', async () => {
        toolsStatus.textContent = 'Localisation en cours…';
        try {
          const position = await getCurrentPosition();
          currentPosition = position;
          const gpsCount = destinations.filter(item =>
            Number.isFinite(Number(item.lat)) && Number.isFinite(Number(item.lon))
          ).length;
          toolsStatus.textContent = gpsCount
            ? `Position obtenue (±${Math.round(position.accuracy)} m). Les distances sont affichées pour ${gpsCount} favori${gpsCount > 1 ? 's' : ''} avec coordonnées GPS.`
            : `Position obtenue (±${Math.round(position.accuracy)} m). Aucun favori n’a encore de coordonnées : ouvre ••• sur une destination puis « Utiliser ma position ».`;
          render();
        } catch (error) {
          toolsStatus.textContent = error.message;
        }
      });

      useCurrentLocationBtn.addEventListener('click', async () => {
        const previous = useCurrentLocationBtn.textContent;
        useCurrentLocationBtn.disabled = true;
        useCurrentLocationBtn.textContent = 'Localisation…';
        formError.textContent = '';
        try {
          pendingCoords = await getCurrentPosition({ maximumAge: 10000 });
          updateCoordsStatus();
        } catch (error) {
          formError.textContent = error.message;
        } finally {
          useCurrentLocationBtn.disabled = false;
          useCurrentLocationBtn.textContent = previous;
        }
      });

      reorderBtn.addEventListener('click', () => {
        renderReorder();
        closeSheet(toolsBackdrop);
        openSheet(reorderBackdrop);
      });

      closeReorderBtn.addEventListener('click', () => closeSheet(reorderBackdrop));
      reorderBackdrop.addEventListener('click', event => {
        if (event.target === reorderBackdrop) closeSheet(reorderBackdrop);
      });

      clearRecentsBtn.addEventListener('click', () => {
        recents = [];
        saveRecents();
        renderRecents();
      });

      exportBtn.addEventListener('click', exportBackup);

      importBtn.addEventListener('click', () => importInput.click());

      importInput.addEventListener('change', async () => {
        const file = importInput.files && importInput.files[0];
        if (!file) return;

        try {
          const raw = await file.text();
          const parsed = JSON.parse(raw);
          const imported = validateImportedDestinations(parsed.destinations ?? parsed);

          if (!imported) throw new Error('Le fichier ne contient pas de destinations valides.');

          destinations = imported;
          if (parsed && (parsed.provider === 'google' || parsed.provider === 'waze')) {
            provider = parsed.provider;
            localStorage.setItem(PROVIDER_KEY, provider);
            document.querySelectorAll('.provider').forEach(btn =>
              btn.classList.toggle('active', btn.dataset.provider === provider)
            );
          }

          if (parsed && Array.isArray(parsed.recents)) {
            const validIds = new Set(destinations.map(item => item.id));
            recents = parsed.recents.filter(id => validIds.has(id)).slice(0, MAX_RECENTS);
          } else {
            recents = [];
          }

          save();
          saveRecents();
          render();
          toolsStatus.textContent = `${destinations.length} destination${destinations.length > 1 ? 's' : ''} importée${destinations.length > 1 ? 's' : ''} avec succès.`;
        } catch (error) {
          toolsStatus.textContent = `Import impossible : ${error.message}`;
        } finally {
          importInput.value = '';
        }
      });

      document.querySelectorAll('.provider').forEach(button => {
        button.classList.toggle('active', button.dataset.provider === provider);
        button.addEventListener('click', () => {
          provider = button.dataset.provider;
          localStorage.setItem(PROVIDER_KEY, provider);
          document.querySelectorAll('.provider').forEach(btn => btn.classList.toggle('active', btn === button));
        });
      });

      render();
    })();
  </script>
</body>
</html>
